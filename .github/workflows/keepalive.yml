name: instabox-keepalive

on:
  schedule:
    # 每 20 分钟（9/29/49 分错峰）。刻意避开最拥挤的 */5 档位：
    # GitHub 免费档定时任务高峰期会大幅延迟甚至丢弃，错峰档位可靠得多。
    # 恢复延迟 ≤20 分钟完全够用（换气时点在运行满 360 分钟后，距 480 硬顶余量 2 小时）。
    - cron: "9,29,49 * * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "立即执行一次完整换气 (suspend→冷却→wake)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: instabox-keepalive
  cancel-in-progress: false # 换气期间 cron 触发的运行排队等待，绝不取消进行中的换气

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive guard
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_API_URL: "https://api.instabox.sh"
          INSTABOX_MACHINE: "bc"
          INSTABOX_REFRESH_MINUTES: "360"
          INSTABOX_REFRESH_NOW: ${{ github.event.inputs.refresh == 'true' && '1' || '0' }}
        run: python3 keepalive.py
